name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать код проекта
        uses: actions/checkout@v4

      - name: Установить Rust и цель для Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Кэшировать зависимости Rust
        uses: Swatinem/rust-cache@v2

      - name: Установить cargo-apk
        run: cargo install cargo-apk

      - name: Настроить Android SDK и NDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-30" "platforms;android-36" "build-tools;36.0.0"
          NDK_DIR=$(ls -d "$ANDROID_HOME/ndk/"* | sort -V | tail -n 1)
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV

      - name: Собрать APK
        run: cargo apk build

      - name: Сохранить готовый APK
        uses: actions/upload-artifact@v4
        with:
          name: rust-explorer-apk
          path: target/debug/apk/*.apk
